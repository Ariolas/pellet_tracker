add_bag:
  name: Ajouter un sac
  description: >
    Compte manuellement un sac de granulés ajouté dans la réserve
    (remplissage non détecté automatiquement).
  fields:
    nombre:
      name: Nombre de sacs
      description: Nombre de sacs à ajouter au compteur.
      required: false
      advanced: false
      default: 1
      selector:
        number:
          min: 1
          max: 50
          step: 1
          mode: box

reset_counter:
  name: Réinitialiser le compteur
  description: >
    Remet à zéro les compteurs de sacs et le % consommé cumulé.

reset_learning:
  name: Réinitialiser l'apprentissage
  description: >
    Remet delta_un_sac à la valeur de calibration initiale et efface
    l'historique des deltas confirmés (tolérance adaptative repart de zéro).
  fields:
    delta_un_sac:
      name: Delta d'un sac (%)
      description: >
        Valeur de calibration terrain (% gagné pour 1 sac de 15 kg).
        Laisse vide pour reprendre la valeur de la configuration.
      required: false
      advanced: false
      selector:
        number:
          min: 0.1
          max: 100
          step: 0.1
          mode: box